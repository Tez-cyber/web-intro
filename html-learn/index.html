<!DOCTYPE html>
<!-- 
    INTRO TO HTML
    => IT consists of elements => example <p>Element</p>
    => Elements consists of tags and its content
    => Mosts tags usually have opening tags and closing tags <p> (opening tag) || </p> (closing tag)
-->
<!-- Main parent element -->
<html lang="en">
    <!-- 
        Data that cant be seen but are used on the internet
        to pass some sets of informations
      -->
    <head>
        <!-- It tells the browser the character encoding used to display text,
            symbols.
            UTF-8 => Unicode Transformation format - 8 bit (standard)
        -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="This is an intro course to learning HTML">
        <title>Intro to HTML</title>
    </head>

    <!-- 
        Contains data that can be seen
    -->
    <body>
        
    </body>
</html>
